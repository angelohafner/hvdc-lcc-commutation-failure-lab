name: Validate educational release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-browser:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install verification dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --prefix .local/web playwright@1.65.1
      - name: Build the self-contained virtual laboratory
        run: python python/build_single_file.py
      - name: Run Python checks (native evidence tests skip on source-only checkouts)
        run: python -m unittest discover -s tests -v
      - name: Audit release files and links
        run: python python/audit_release.py
      - name: Exercise all modules and recordings through direct file opening
        shell: pwsh
        run: |
          $env:LAB_URL = ([uri]((Join-Path $env:GITHUB_WORKSPACE 'docs') + '/')).AbsoluteUri
          node tests/test_html/interaction.cjs
      - name: Exercise the isolated single HTML with networking disabled
        run: node tests/test_html/single_file.cjs
      - name: Assemble the Pages site with the verified standalone HTML
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python -c "import shutil; shutil.copytree('docs', '.local/pages', dirs_exist_ok=True); shutil.copy2('dist/HVDC_LCC_Virtual_Laboratory.html', '.local/pages/HVDC_LCC_Virtual_Laboratory.html'); shutil.copy2('dist/HVDC_LCC_Virtual_Laboratory.manifest.json', '.local/pages/HVDC_LCC_Virtual_Laboratory.manifest.json')"
      - name: Upload the verified Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .local/pages
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            reports/browser_tests.json
            reports/release_audit.json
            reports/single_file_browser_tests.json
  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: source-and-browser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy the verified site
        id: deployment
        uses: actions/deploy-pages@v4
